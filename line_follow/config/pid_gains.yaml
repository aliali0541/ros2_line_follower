# =============================================================================
# pid_gains.yaml
# ROS 2 parameter file for the Line-Following Robot (line_follow package)
#
# Location in package:  line_follow/config/pid_gains.yaml
#
# How ROS 2 loads this file:
#   - Automatically at launch via line_follow.launch.py (parameters=[...yaml])
#   - Manually: ros2 param load /line_controller_node \
#                   ~/ros2_ws/src/line_follow/config/pid_gains.yaml
#
# HOW TO TUNE — step by step
# ──────────────────────────
#  1.  Set ki=0, kd=0.  Start with a small kp (e.g. 0.5).
#  2.  Increase kp until the robot follows the line but oscillates.
#  3.  Back off kp by ~20 %.  This is your working Kp.
#  4.  Add kd slowly (e.g. 0.02 steps) to damp the oscillations.
#  5.  Add ki only if the robot drifts off on long straights (use tiny values).
#
# SYMPTOM GUIDE
# ─────────────────────────────────────────────────────────────
# Too-high  Kp  → robot wiggles / oscillates left-right rapidly on straights
# Too-low   Kp  → robot is sluggish; cuts corners on turns; loses the line
# Too-high  Kd  → robot jerks / stutters; amplifies sensor noise
# Too-high  Ki  → robot drifts into slow, widening spirals (integral windup)
# =============================================================================

/**:                          # wildcard — applies to ALL nodes in this file
  ros__parameters:

    # ── PID controller (line_controller_node) ──────────────────────────────
    kp: 1.2          # Proportional gain  — main "steering force"
    ki: 0.0          # Integral gain      — corrects steady-state offset
    kd: 0.05         # Derivative gain    — dampens oscillations

    # ── Velocity limits ────────────────────────────────────────────────────
    base_speed:  0.15    # Forward speed while on the line [m/s]
    max_angular: 2.0     # Hard cap on angular velocity   [rad/s]

    # ── Obstacle avoidance (obstacle_avoider_node) ─────────────────────────
    obstacle_distance_threshold: 0.25   # Trigger distance [m]  (≈ 25 cm)

    # ── Bypass manoeuvre timing ─────────────────────────────────────────────
    # How long each phase of the avoidance state-machine lasts [seconds]
    bypass_turn_duration:     1.2   # Time spent turning left/right
    bypass_straight_duration: 1.0   # Time spent going straight past obstacle

    # ── Lap monitor (lap_monitor_node) ─────────────────────────────────────
    lap_completion_radius: 0.15   # Return-to-start radius [m]
    min_lap_distance:      0.50   # Min travel before lap detection arms [m]
    # ── modify motion (cmd_mux_node) ─────────────────────────────────────
    __avoiding__:  0.0
# =============================================================================
# EXAMPLE TUNING LOG  (fill this in during your experiments)
# =============================================================================
#
# | Trial | kp   | ki   | kd   | base_speed | Lap time | RMS error | Notes
# |-------|------|------|------|------------|----------|-----------|-------
# |   1   | 0.50 | 0.00 | 0.00 |   0.10     |   --     |    --     | Sluggish, cuts corners
# |   2   | 1.00 | 0.00 | 0.00 |   0.10     |   --     |    --     | Oscillates on straight
# |   3   | 0.80 | 0.00 | 0.00 |   0.10     |   --     |    --     | Better, slight wiggle
# |   4   | 0.80 | 0.00 | 0.03 |   0.10     |   --     |    --     | Wiggle gone
# |   5   | 1.20 | 0.00 | 0.05 |   0.15     |   --     |    --     | ← current best
# =============================================================================

